# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

# --- CONFIGURACION DE LA PANTALLA ---#
monitor = eDP-1,3840x2400@60,0x0,2
env = XCURSOR_THEME,MyCursor
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
exec-once = xrdb ~/.Xresources

general {
    gaps_in = 1
    gaps_out = 0
    border_size = 2
}

exec-once = awww-daemon
exec-once = bash /home/cristopher/.config/hypr/wallpaper-cycle.sh
exec-once = hyprpanel


$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
# exec-once = waybar

# --- MIS COMBINACIONES DE VENTANAS Y ESCRITORIOS ---

# Pantalla completa con Super + F
bind = $mainMod, F, fullscreen, 1

# Modos de diseño (Dwindle)
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit

# Moverse entre ventanas con las Flechas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Moverse entre ventanas con letras HJKL (Estilo Vim)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- ATASJOS PARA ESCRITORIOS VIRTUALES (WORKSPACES) ---

# Cambiar al escritorio X (Super + 1, Super + 2, etc.)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Mover ventana activa al escritorio X (Super + Shift + 1, etc.)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# --- INTERCAMBIAR POSICIÓN DE VENTANAS ---

# Intercambiar ventanas usando las Flechas (Super + Shift + Flecha)
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Intercambiar ventanas usando HJKL (Super + Shift + Letra)
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# --- CONFIGURACIÓN DEL CONTROL DEL BRILLO DE LA PANTALLA ---#
bindel = SUPER, F5, exec, brightnessctl set 5%-
bindel = SUPER, F6, exec, brightnessctl set 5%+

# --- CONFIGURACION DEL SONIDO ---#
bindel = SUPER, F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = SUPER, F2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = SUPER, F3, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+


bind = SUPER, M, movetoworkspacesilent, special

# Mostrar/ocultar el workspace especial
# bind = SUPER SHIFT, M, togglespecialworkspaceks

# --- CONFIGURACIÓN DE ENTRADA (MOUSE Y TECLADO) ---
input {
    kb_layout = us
    kb_variant = myintl

    #Touchpad
    sensitivity = 0.1
    touchpad {
        natural_scroll = true
    }
}

device {
    name = logitech-g203-lightsync-gaming-mouse
    sensitivity = -0.8
}

exec-once = bash /home/cristopher/.config/eww/launch_widgets.sh
exec-once = python3 /home/cristopher/.config/eww/matrix-window.py
exec-once = python3 /home/cristopher/.config/eww/doom-widget.py

# Mover ventana activa a la mitad derecha
bind = SUPER ALT, left, exec, hyprctl dispatch setfloating && hyprctl dispatch movewindow l && hyprctl dispatch resizeactive exact 50% 100%
bind = SUPER ALT, right, exec, hyprctl dispatch setfloating && hyprctl dispatch movewindow r && hyprctl dispatch resizeactive exact 50% 100%

cursor {
    no_hardware_cursors = false
    default_monitor = eDP-1
}

decoration {
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

xwayland {
    force_zero_scaling = false
}